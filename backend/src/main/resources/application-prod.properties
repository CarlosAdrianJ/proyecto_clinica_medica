spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}

security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
security.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
security.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never