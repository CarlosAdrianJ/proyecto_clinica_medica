spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/clinica_medica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

server.port=${PORT:8080}

security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
security.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
security.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# No exponer detalles internos ni valores rechazados en respuestas de error.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never